name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - initial-structure

jobs:
  lint:
    name: Lint Docs And GitHub Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md

      - name: Lint GitHub YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github
          config_data: |
            extends: default
            rules:
              line-length:
                max: 160
              truthy:
                allowed-values: ['true', 'false', 'on']
